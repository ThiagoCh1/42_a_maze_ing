[metadata]
name = mazegen
version = 1.0.0
description = Reusable 2D maze generator with multiple algorithms.
long_description = file: README.md
long_description_content_type = text/markdown
requires_python = >=3.10

[options]
packages = mazegen
python_requires = >=3.10

[options.extras_require]
dev =
    mypy
    flake8
    pytest
    build
